# Fly.io, London. Rename `app` if "kalid-nur" is taken when you run `fly launch`.
app = "kalid-nur"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # SITE_URL and ANTHROPIC_API_KEY are secrets: see docs/DEPLOYED.md.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine always on, so the first visitor never waits for a cold start.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Keeps Ask's monthly spend total across deploys. Create it once: fly volumes create ask_data --region lhr --size 1
[mounts]
  source = "ask_data"
  destination = "/app/data"
